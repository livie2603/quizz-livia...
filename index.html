<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz de Inteligência Artificial</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: #a5b4fc;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: #334155;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            transition: width 0.3s;
        }

        .question-number {
            color: #818cf8;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .question {
            font-size: 1.3rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer {
            width: 100%;
            padding: 15px;
            border: 2px solid #475569;
            border-radius: 12px;
            background: #1e293b;
            color: white;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .answer:hover {
            border-color: #818cf8;
            background: #312e81;
            transform: translateY(-2px);
        }

        .answer.correct {
            background: #14532d;
            border-color: #22c55e;
        }

        .answer.wrong {
            background: #7f1d1d;
            border-color: #ef4444;
        }

        .answer:disabled {
            cursor: default;
        }

        .next-button {
            display: block;
            margin: 25px auto 0;
            padding: 13px 30px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .next-button:hover {
            background: #818cf8;
            transform: scale(1.03);
        }

        .next-button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            text-align: center;
            display: none;
        }

        .result h2 {
            color: #a5b4fc;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .score {
            font-size: 4rem;
            font-weight: bold;
            color: #22c55e;
            margin: 20px 0;
        }

        .message {
            color: #cbd5e1;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .restart {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .restart:hover {
            background: #818cf8;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            .question {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section id="quiz">

            <h1>🤖 Quiz de Inteligência Artificial</h1>

            <p class="subtitle">
                Teste seus conhecimentos sobre IA, Machine Learning e tecnologia.
            </p>

            <div class="progress-container">
                <div class="progress" id="progress"></div>
            </div>

            <div class="question-number" id="questionNumber"></div>

            <div class="question" id="question"></div>

            <div class="answers" id="answers"></div>

            <button class="next-button" id="nextButton" disabled>
                Próxima pergunta
            </button>

        </section>

        <section class="result" id="result">

            <h2>🎉 Quiz finalizado!</h2>

            <p>Você acertou:</p>

            <div class="score" id="score"></div>

            <p class="message" id="message"></p>

            <button class="restart" onclick="restartQuiz()">
                Jogar novamente
            </button>

        </section>

        <div class="footer">
            Quiz de Inteligência Artificial • HTML, CSS e JavaScript
        </div>

    </main>

    <script>

        const questions = [

            {
                question: "O que significa a sigla IA?",
                answers: [
                    "Inteligência Artificial",
                    "Internet Avançada",
                    "Informação Automática",
                    "Integração Algorítmica"
                ],
                correct: 0
            },

            {
                question: "O que é Machine Learning?",
                answers: [
                    "Um tipo de computador físico",
                    "Uma área da IA que permite aos sistemas aprenderem com dados",
                    "Um sistema operacional",
                    "Um programa usado apenas para editar imagens"
                ],
                correct: 1
            },

            {
                question: "Qual destes é um exemplo de IA generativa?",
                answers: [
                    "Uma calculadora simples",
                    "Um editor de texto tradicional",
                    "Um modelo que gera textos ou imagens a partir de comandos",
                    "Um cabo USB"
                ],
                correct: 2
            },

            {
                question: "O que é um algoritmo?",
                answers: [
                    "Uma sequência de instruções para resolver um problema",
                    "Um tipo de monitor",
                    "Uma linguagem de programação específica",
                    "Um componente físico do computador"
                ],
                correct: 0
            },

            {
                question: "Para que servem os dados no treinamento de modelos de IA?",
                answers: [
                    "Para decorar o computador",
                    "Para fornecer exemplos que ajudam o modelo a aprender padrões",
                    "Para aumentar fisicamente a memória RAM",
                    "Para substituir o processador"
                ],
                correct: 1
            },

            {
                question: "O que é uma rede neural artificial?",
                answers: [
                    "Uma rede social para robôs",
                    "Um cabo utilizado para conectar computadores",
                    "Um modelo computacional inspirado, de forma simplificada, em redes de neurônios",
                    "Um tipo de antivírus"
                ],
                correct: 2
            },

            {
                question: "Qual linguagem é muito utilizada em projetos de Inteligência Artificial?",
                answers: [
                    "Python",
                    "HTML",
                    "CSS",
                    "SQL"
                ],
                correct: 0
            },

            {
                question: "O que é um chatbot?",
                answers: [
                    "Um robô que só funciona sem internet",
                    "Um sistema capaz de conversar com usuários por meio de texto ou voz",
                    "Um tipo de placa de vídeo",
                    "Um banco de dados físico"
                ],
                correct: 1
            },

            {
                question: "O que significa treinamento de um modelo de IA?",
                answers: [
                    "Ensinar o computador a montar hardware",
                    "Processar exemplos para que o modelo aprenda padrões e relações",
                    "Instalar um novo monitor",
                    "Limpar arquivos temporários"
                ],
                correct: 1
            },

            {
                question: "Qual é uma preocupação importante ao desenvolver sistemas de IA?",
                answers: [
                    "A cor do teclado",
                    "O tamanho do monitor",
                    "Privacidade, segurança e uso responsável dos dados",
                    "A quantidade de cabos USB"
                ],
                correct: 2
            }

        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionElement = document.getElementById("question");
        const answersElement = document.getElementById("answers");
        const questionNumberElement = document.getElementById("questionNumber");
        const nextButton = document.getElementById("nextButton");
        const progressElement = document.getElementById("progress");

        function loadQuestion() {

            answered = false;
            nextButton.disabled = true;

            const current = questions[currentQuestion];

            questionNumberElement.textContent =
                `Pergunta ${currentQuestion + 1} de ${questions.length}`;

            questionElement.textContent = current.question;

            progressElement.style.width =
                `${((currentQuestion + 1) / questions.length) * 100}%`;

            answersElement.innerHTML = "";

            current.answers.forEach((answer, index) => {

                const button = document.createElement("button");

                button.classList.add("answer");
                button.textContent = answer;

                button.addEventListener("click", () => {
                    selectAnswer(button, index);
                });

                answersElement.appendChild(button);

            });
        }

        function selectAnswer(button, selectedIndex) {

            if (answered) return;

            answered = true;
            nextButton.disabled = false;

            const current = questions[currentQuestion];
            const buttons = document.querySelectorAll(".answer");

            buttons.forEach((btn, index) => {

                btn.disabled = true;

                if (index === current.correct) {
                    btn.classList.add("correct");
                }

            });

            if (selectedIndex === current.correct) {

                score++;

            } else {

                button.classList.add("wrong");

            }
        }

        nextButton.addEventListener("click", () => {

            currentQuestion++;

            if (currentQuestion < questions.length) {

                loadQuestion();

            } else {

                showResult();

            }

        });

        function showResult() {

            document.getElementById("quiz").style.display = "none";
            document.getElementById("result").style.display = "block";

            document.getElementById("score").textContent =
                `${score}/${questions.length}`;

            const percentage =
                Math.round((score / questions.length) * 100);

            let message;

            if (percentage === 100) {

                message = "Excelente! Você acertou todas as perguntas! 🏆";

            } else if (percentage >= 70) {

                message = "Muito bem! Você tem bons conhecimentos sobre IA! 🚀";

            } else if (percentage >= 50) {

                message = "Bom trabalho! Continue estudando Inteligência Artificial. 📚";

            } else {

                message = "Continue praticando! Cada pergunta é uma oportunidade para aprender. 💡";

            }

            document.getElementById("message").textContent = message;
        }

        function restartQuiz() {

            currentQuestion = 0;
            score = 0;

            document.getElementById("result").style.display = "none";
            document.getElementById("quiz").style.display = "block";

            loadQuestion();
        }

        loadQuestion();

    </script>

</body>
</html>
